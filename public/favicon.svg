<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <!-- Glowing Accent Gradient for H and P -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.6)"/>
      <stop offset="50%" stop-color="rgba(129, 140, 248, 0.2)"/>
      <stop offset="100%" stop-color="rgba(52, 211, 153, 0.6)"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <!-- Circuit Micro-Dot Accent in Corner -->
  <circle cx="12" cy="12" r="2" fill="#38bdf8" opacity="0.8"/>
  <circle cx="52" cy="52" r="2" fill="#34d399" opacity="0.8"/>
  <line x1="12" y1="12" x2="20" y2="12" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" opacity="0.4"/>
  <line x1="52" y1="52" x2="44" y2="52" stroke="#34d399" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Monogram HP Geometry -->
  <g filter="url(#glow)">
    <!-- Letter H -->
    <!-- Left vertical bar -->
    <rect x="16" y="18" width="5" height="28" rx="2.5" fill="url(#accentGrad)"/>
    <!-- Right vertical bar of H (shared stem with P) -->
    <rect x="28" y="18" width="5" height="28" rx="2.5" fill="url(#accentGrad)"/>
    <!-- H Crossbar -->
    <rect x="18" y="30" width="13" height="4.5" rx="2" fill="url(#accentGrad)"/>

    <!-- Letter P Loop (extending from stem at x=28) -->
    <path d="M 31 18 C 42 18, 47 22, 47 28.5 C 47 35, 42 39, 31 39" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Center Core Node Accent -->
  <circle cx="28" cy="32.25" r="2.5" fill="#ffffff" opacity="0.9"/>
</svg>